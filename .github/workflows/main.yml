name: Controllo Casa & Risparmio

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: controllo-casa-risparmio
  cancel-in-progress: true

jobs:
  controllo:
    name: Controllo progetto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Controlla struttura del progetto
        shell: bash
        run: |
          set -e

          echo "Controllo file principali..."

          test -f index.html
          test -f config.js
          test -f latest_deal.json
          test -f manifest.json
          test -f sw.js
          test -f api/worker.js
          test -f api/wrangler.jsonc

          echo "Struttura OK."

      - name: Controlla JSON
        shell: bash
        run: |
          set -e

          python -m json.tool manifest.json > /dev/null
          python -m json.tool latest_deal.json > /dev/null
          python -m json.tool api/wrangler.jsonc > /dev/null

          echo "JSON validi."

      - name: Controlla JavaScript
        shell: bash
        run: |
          set -e

          node --check api/worker.js

          echo "JavaScript valido."

      - name: Controlla file Amazon legacy
        shell: bash
        run: |
          set -e

          if [ -f amazon_catalog.json ] || \
             [ -f amazon_creators.py ] || \
             [ -f update_deal.py ]; then

            echo "ERRORE: sono presenti file della vecchia architettura."
            echo "Rimuovi amazon_catalog.json, amazon_creators.py e update_deal.py."
            exit 1
          fi

          echo "Nessun file Amazon legacy trovato."

      - name: Controllo completato
        run: |
          echo "======================================"
          echo " CASA & RISPARMIO"
          echo " Controllo progetto completato"
          echo "======================================"
