name: Aggiorna offerta da Telegram

on:
  schedule:
    # Ogni 30 minuti. Adatta la cadenza in base a quanto spesso pubblichi.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui lo scraping
        run: python update_deal.py

      - name: Commit del JSON aggiornato (solo se cambiato)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- latest_deal.json; then
            echo "Nessuna modifica: nuovo post non ancora arrivato."
          else
            git add latest_deal.json
            git commit -m "Aggiorna offerta $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
